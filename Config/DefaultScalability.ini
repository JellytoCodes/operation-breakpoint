; TutorialMap's overcast clouds keep their authored coverage, density and color.
; Medium limits ray-march samples to reduce their measured GPU cost.
; Explicit engine defaults in other tiers restore them when switching presets.

[EffectsQuality@0]
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=80

[EffectsQuality@1]
r.VolumetricCloud.ViewRaySampleMaxCount=48
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=6

[EffectsQuality@2]
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=80

[EffectsQuality@3]
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=80

[EffectsQuality@Cine]
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=80

[TextureQuality@1]
; The authored Stage_01 route exceeds the engine's 600 MB Medium budget.
; Preserve Medium texture quality while allowing a bounded 2 GB streaming pool.
r.Streaming.PoolSize=2048
